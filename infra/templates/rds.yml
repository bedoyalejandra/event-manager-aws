AWSTemplateFormatVersion: "2010-09-09"
Description: Aurora Serverless v2 para Event Manager App

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC donde se desplegará Aurora
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets privadas para Aurora
  DBUsername:
    Type: String
    Default: event_admin
    Description: Nombre de usuario de la DB
  DBPassword:
    Type: String
    NoEcho: true
    Default: ""
    Description: Contraseña de la DB (se usará solo si no se genera en Secrets Manager)
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Environment name (dev or prod)

Resources:
  ############################################
  # Security Group para Aurora
  ############################################
  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group para Aurora Serverless
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub 'event-manager-rds-sg-${Environment}'
        - Key: Environment
          Value: !Ref Environment

  # Regla de ingreso separada para evitar dependencia circular
  RDSSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RDSSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref RDSSecurityGroup
      Description: Allow MySQL access from Lambda functions in same security group

  # Regla adicional para permitir acceso desde subnets públicas (donde estarán las Lambdas)
  RDSSecurityGroupIngressFromPublicSubnets:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RDSSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      CidrIp: 10.0.0.0/16
      Description: Allow MySQL access from VPC CIDR (includes public subnets for Lambda functions)

  # Regla para permitir acceso desde Lambda functions fuera del VPC (internet)
  RDSSecurityGroupIngressFromInternet:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RDSSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      CidrIp: 0.0.0.0/0
      Description: Allow MySQL access from Lambda functions outside VPC (temporary for testing)

  ############################################
  # Subnet Group para Aurora
  ############################################
  EventDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group para Aurora
      SubnetIds: !Ref SubnetIds

  ############################################
  # Secret en Secrets Manager
  ############################################
  DBCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: event-app/db-credentials
      Description: Credenciales para Aurora EventManagerDB
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${DBUsername}"}'
        GenerateStringKey: password
        PasswordLength: 30
        ExcludePunctuation: true

  ############################################
  # Aurora Serverless Cluster
  ############################################
  EventDBCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      Engine: aurora-mysql
      EngineMode: provisioned
      DatabaseName: EventManagerDB
      MasterUsername: !Sub "{{resolve:secretsmanager:${DBCredentialsSecret}::username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DBCredentialsSecret}::password}}"
      DBSubnetGroupName: !Ref EventDBSubnetGroup
      VpcSecurityGroupIds:
        - !Ref RDSSecurityGroup
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0.5
        MaxCapacity: 2

  ############################################
  # Aurora DB Instance (required for Serverless v2)
  ############################################
  EventDBInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceClass: db.serverless
      DBClusterIdentifier: !Ref EventDBCluster
      Engine: aurora-mysql
      PubliclyAccessible: false
      Tags:
        - Key: Name
          Value: !Sub 'event-manager-db-instance-${Environment}'
        - Key: Environment
          Value: !Ref Environment

Outputs:
  RDSSecretArn:
    Description: ARN del secreto con las credenciales de Aurora
    Value: !Ref DBCredentialsSecret
    Export:
      Name: !Sub "${AWS::StackName}-RDSSecretArn"

  RDSClusterEndpoint:
    Description: Endpoint del cluster Aurora
    Value: !GetAtt EventDBCluster.Endpoint.Address
    Export:
      Name: !Sub "${AWS::StackName}-RDSClusterEndpoint"

  RDSSecurityGroupId:
    Description: ID del Security Group de Aurora
    Value: !Ref RDSSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-RDSSecurityGroupId"
