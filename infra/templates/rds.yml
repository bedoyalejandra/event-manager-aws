AWSTemplateFormatVersion: "2010-09-09"
Description: Simple MySQL RDS Instance for Event Manager App

Parameters:
  DBUsername:
    Type: String
    Default: event_admin
    Description: Nombre de usuario de la DB
  DBPassword:
    Type: String
    NoEcho: true
    Default: ""
    Description: Contraseña de la DB (se usará solo si no se genera en Secrets Manager)
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Environment name (dev or prod)

Resources:
  ############################################
  # DB Subnet Group using default VPC subnets
  ############################################
  EventDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for MySQL using default VPC
      SubnetIds:
        - subnet-00d0b1c092455f39b  # us-west-2a
        - subnet-050b4588773287626  # us-west-2b
      Tags:
        - Key: Name
          Value: !Sub 'event-manager-subnet-group-${Environment}'

  ############################################
  # Security Group for MySQL (Default VPC)
  ############################################
  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group for MySQL RDS
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: 0.0.0.0/0
          Description: Allow MySQL access from internet for Lambda functions
      Tags:
        - Key: Name
          Value: !Sub 'event-manager-rds-sg-${Environment}'
        - Key: Environment
          Value: !Ref Environment

  ############################################
  # Secret en Secrets Manager
  ############################################
  DBCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'event-app/db-credentials-${Environment}-${AWS::AccountId}'
      Description: Credenciales para MySQL EventManagerDB
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${DBUsername}"}'
        GenerateStringKey: password
        PasswordLength: 30
        ExcludePunctuation: true

  ############################################
  # Simple MySQL RDS Instance
  ############################################
  EventDBInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub 'event-manager-db-${Environment}'
      DBInstanceClass: db.t3.micro
      Engine: mysql
      EngineVersion: 8.0.43
      DBName: EventManagerDB
      MasterUsername: !Sub "{{resolve:secretsmanager:${DBCredentialsSecret}::username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DBCredentialsSecret}::password}}"
      AllocatedStorage: 20
      DBSubnetGroupName: !Ref EventDBSubnetGroup
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup
      PubliclyAccessible: true
      BackupRetentionPeriod: 0  # No backups for dev
      MultiAZ: false
      StorageType: gp2
      Tags:
        - Key: Name
          Value: !Sub 'event-manager-db-${Environment}'
        - Key: Environment
          Value: !Ref Environment

Outputs:
  RDSSecretArn:
    Description: ARN del secreto con las credenciales de MySQL
    Value: !Ref DBCredentialsSecret
    Export:
      Name: !Sub "${AWS::StackName}-RDSSecretArn"

  RDSClusterEndpoint:
    Description: Endpoint de la instancia MySQL
    Value: !GetAtt EventDBInstance.Endpoint.Address
    Export:
      Name: !Sub "${AWS::StackName}-RDSClusterEndpoint"

  RDSSecurityGroupId:
    Description: ID del Security Group de MySQL
    Value: !Ref RDSSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-RDSSecurityGroupId"
