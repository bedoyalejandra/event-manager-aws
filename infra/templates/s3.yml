AWSTemplateFormatVersion: "2010-09-09"
Description: S3 Buckets para Event Manager App

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Environment name

  # Resource validation parameters
  CreateS3Buckets:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Whether to create new S3 buckets or use existing ones

  ExistingLambdaCodeBucket:
    Type: String
    Default: ""
    Description: Name of existing Lambda code bucket (required if CreateS3Buckets=false)

  ExistingReportsBucket:
    Type: String
    Default: ""
    Description: Name of existing reports bucket (required if CreateS3Buckets=false)

Conditions:
  CreateNewBuckets: !Equals [!Ref CreateS3Buckets, "true"]
  UseExistingBuckets: !Equals [!Ref CreateS3Buckets, "false"]

Resources:
  # ===========================================
  # Bucket para código Lambda (automático)
  # ===========================================
  LambdaCodeBucket:
    Type: AWS::S3::Bucket
    Condition: CreateNewBuckets
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "event-manager-lambda-code-${Environment}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  # ===========================================
  # Bucket para almacenar reportes generados
  # ===========================================
  ReportsBucket:
    Type: AWS::S3::Bucket
    Condition: CreateNewBuckets
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "event-manager-reports-${Environment}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldReports
            Status: Enabled
            ExpirationInDays: 90  # Eliminar reportes después de 90 días

  # ===========================================
  # Política para acceso de Lambda Functions
  # ===========================================
  ReportsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateNewBuckets
    Properties:
      Bucket: !Ref ReportsBucket
      PolicyDocument:
        Statement:
          - Sid: AllowLambdaAccess
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub "${ReportsBucket.Arn}/*"
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId

Outputs:
  LambdaCodeBucketName:
    Description: Nombre del bucket para código Lambda
    Value: !If [CreateNewBuckets, !Ref LambdaCodeBucket, !Ref ExistingLambdaCodeBucket]
    Export:
      Name: !Sub "${AWS::StackName}-LambdaCodeBucketName"

  LambdaCodeBucketArn:
    Description: ARN del bucket para código Lambda
    Value: !If 
      - CreateNewBuckets
      - !GetAtt LambdaCodeBucket.Arn
      - !Sub "arn:aws:s3:::${ExistingLambdaCodeBucket}"
    Export:
      Name: !Sub "${AWS::StackName}-LambdaCodeBucketArn"

  ReportsBucketName:
    Description: Nombre del bucket para reportes
    Value: !If [CreateNewBuckets, !Ref ReportsBucket, !Ref ExistingReportsBucket]
    Export:
      Name: !Sub "${AWS::StackName}-ReportsBucketName"

  ReportsBucketArn:
    Description: ARN del bucket para reportes
    Value: !If 
      - CreateNewBuckets
      - !GetAtt ReportsBucket.Arn
      - !Sub "arn:aws:s3:::${ExistingReportsBucket}"
    Export:
      Name: !Sub "${AWS::StackName}-ReportsBucketArn"