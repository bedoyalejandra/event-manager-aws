AWSTemplateFormatVersion: "2010-09-09"
Description: Lambda functions for Event Manager application

Parameters:
  RDSSecretArn:
    Type: String
    Description: ARN of the RDS credentials in Secrets Manager
  RDSClusterEndpoint:
    Type: String
    Description: Aurora cluster endpoint
  LambdaCodeBucket:
    Type: String
  LambdaCodeKey:
    Type: String
  ReportsBucket:
    Type: String
    Description: S3 bucket for storing reports
  EmailQueue:
    Type: String
    Description: SQS queue URL for email processing
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Environment name
  EventBusName:
    Type: String
    Default: ""
    Description: EventBridge Event Bus name (optional)
  SchedulerRoleArn:
    Type: String
    Default: ""
    Description: EventBridge Scheduler Role ARN (optional)

Resources:
  # Lambda Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "EventManagerLambdaRole-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/SecretsManagerReadWrite
        - arn:aws:iam::aws:policy/AmazonRDSFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/AmazonSQSFullAccess
        - arn:aws:iam::aws:policy/AmazonSESFullAccess
        - arn:aws:iam::aws:policy/AmazonEventBridgeFullAccess
      Policies:
        - PolicyName: EventBridgeSchedulerPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - scheduler:CreateSchedule
                  - scheduler:DeleteSchedule
                  - scheduler:GetSchedule
                  - scheduler:UpdateSchedule
                Resource: "*"
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: "*"
                Condition:
                  StringEquals:
                    iam:PassedToService: scheduler.amazonaws.com

  # 1. Create Event Lambda
  CreateEventLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "CreateEventLambda-${Environment}"
      Runtime: nodejs18.x
      Handler: create-event/index.handler
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          RDS_SECRET_ARN: !Ref RDSSecretArn
          DB_NAME: EventManagerDB
          DB_HOST: !Ref RDSClusterEndpoint
          ENVIRONMENT: !Ref Environment
          EVENT_BUS_NAME: !Ref EventBusName
          SCHEDULER_ROLE_ARN: !Ref SchedulerRoleArn
          DELETE_EVENT_LAMBDA_ARN: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:DeleteEventLambda-${Environment}"
      Role: !GetAtt LambdaExecutionRole.Arn

  # 2. Delete Event Lambda
  DeleteEventLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "DeleteEventLambda-${Environment}"
      Runtime: nodejs18.x
      Handler: delete-event/index.handler
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          RDS_SECRET_ARN: !Ref RDSSecretArn
          DB_NAME: EventManagerDB
          DB_HOST: !Ref RDSClusterEndpoint
          ENVIRONMENT: !Ref Environment
      Role: !GetAtt LambdaExecutionRole.Arn

  # 3. Update Event Lambda
  UpdateEventLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "UpdateEventLambda-${Environment}"
      Runtime: nodejs18.x
      Handler: update-event/index.handler
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          RDS_SECRET_ARN: !Ref RDSSecretArn
          DB_NAME: EventManagerDB
          DB_HOST: !Ref RDSClusterEndpoint
          ENVIRONMENT: !Ref Environment
      Role: !GetAtt LambdaExecutionRole.Arn

  # 4. Disable Event Lambda
  DisableEventLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "DisableEventLambda-${Environment}"
      Runtime: nodejs18.x
      Handler: disable-event/index.handler
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          RDS_SECRET_ARN: !Ref RDSSecretArn
          DB_NAME: EventManagerDB
          DB_HOST: !Ref RDSClusterEndpoint
          ENVIRONMENT: !Ref Environment
      Role: !GetAtt LambdaExecutionRole.Arn

  # 5. Get Active Events Lambda
  GetActiveEventsLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "GetActiveEventsLambda-${Environment}"
      Runtime: nodejs18.x
      Handler: get-active-events/index.handler
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          RDS_SECRET_ARN: !Ref RDSSecretArn
          DB_NAME: EventManagerDB
          DB_HOST: !Ref RDSClusterEndpoint
          ENVIRONMENT: !Ref Environment
      Role: !GetAtt LambdaExecutionRole.Arn

  # 6. Generate Report Lambda
  GenerateReportLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "GenerateReportLambda-${Environment}"
      Runtime: nodejs18.x
      Handler: generate-report/index.handler
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      MemorySize: 512
      Timeout: 300
      Environment:
        Variables:
          RDS_SECRET_ARN: !Ref RDSSecretArn
          DB_NAME: EventManagerDB
          REPORTS_BUCKET: !Ref ReportsBucket
          ENVIRONMENT: !Ref Environment
      Role: !GetAtt LambdaExecutionRole.Arn

  # 7. Get Report Lambda
  GetReportLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "GetReportLambda-${Environment}"
      Runtime: nodejs18.x
      Handler: get-report/index.handler
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          REPORTS_BUCKET: !Ref ReportsBucket
          ENVIRONMENT: !Ref Environment
      Role: !GetAtt LambdaExecutionRole.Arn

  # 8. Process Report Data Lambda
  ProcessReportDataLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "ProcessReportDataLambda-${Environment}"
      Runtime: nodejs18.x
      Handler: process-report-data/index.handler
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      MemorySize: 512
      Timeout: 300
      Environment:
        Variables:
          RDS_SECRET_ARN: !Ref RDSSecretArn
          DB_NAME: EventManagerDB
          REPORTS_BUCKET: !Ref ReportsBucket
          ENVIRONMENT: !Ref Environment
      Role: !GetAtt LambdaExecutionRole.Arn

  # 9. Send Email Lambda
  SendEmailLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "SendEmailLambda-${Environment}"
      Runtime: nodejs18.x
      Handler: send-email/index.handler
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
      Role: !GetAtt LambdaExecutionRole.Arn

  # 10. Send Event Reminder Lambda
  SendEventReminderLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "SendEventReminderLambda-${Environment}"
      Runtime: nodejs18.x
      Handler: send-event-reminder/index.handler
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          RDS_SECRET_ARN: !Ref RDSSecretArn
          DB_NAME: EventManagerDB
          EMAIL_QUEUE: !Ref EmailQueue
          ENVIRONMENT: !Ref Environment
      Role: !GetAtt LambdaExecutionRole.Arn

  # 11. Post Event Assistance Lambda
  PostEventAssistanceLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "PostEventAssistanceLambda-${Environment}"
      Runtime: nodejs18.x
      Handler: post-event-assistance/index.handler
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          RDS_SECRET_ARN: !Ref RDSSecretArn
          DB_NAME: EventManagerDB
          DB_HOST: !Ref RDSClusterEndpoint
          EMAIL_QUEUE: !Ref EmailQueue
          ENVIRONMENT: !Ref Environment
      Role: !GetAtt LambdaExecutionRole.Arn

  # 12. Create Task Lambda (triggered by EventBridge)
  CreateTaskLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "CreateTaskLambda-${Environment}"
      Runtime: nodejs18.x
      Handler: create-task/index.handler
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          RDS_SECRET_ARN: !Ref RDSSecretArn
          DB_NAME: EventManagerDB
          DB_HOST: !Ref RDSClusterEndpoint
          ENVIRONMENT: !Ref Environment
      Role: !GetAtt LambdaExecutionRole.Arn


Outputs:
  # Lambda Function ARNs
  CreateEventLambdaArn:
    Description: ARN of the Create Event Lambda function
    Value: !GetAtt CreateEventLambda.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CreateEventLambdaArn"

  DeleteEventLambdaArn:
    Description: ARN of the Delete Event Lambda function
    Value: !GetAtt DeleteEventLambda.Arn
    Export:
      Name: !Sub "${AWS::StackName}-DeleteEventLambdaArn"

  UpdateEventLambdaArn:
    Description: ARN of the Update Event Lambda function
    Value: !GetAtt UpdateEventLambda.Arn
    Export:
      Name: !Sub "${AWS::StackName}-UpdateEventLambdaArn"

  DisableEventLambdaArn:
    Description: ARN of the Disable Event Lambda function
    Value: !GetAtt DisableEventLambda.Arn
    Export:
      Name: !Sub "${AWS::StackName}-DisableEventLambdaArn"

  GetActiveEventsLambdaArn:
    Description: ARN of the Get Active Events Lambda function
    Value: !GetAtt GetActiveEventsLambda.Arn
    Export:
      Name: !Sub "${AWS::StackName}-GetActiveEventsLambdaArn"

  GenerateReportLambdaArn:
    Description: ARN of the Generate Report Lambda function
    Value: !GetAtt GenerateReportLambda.Arn
    Export:
      Name: !Sub "${AWS::StackName}-GenerateReportLambdaArn"

  GetReportLambdaArn:
    Description: ARN of the Get Report Lambda function
    Value: !GetAtt GetReportLambda.Arn
    Export:
      Name: !Sub "${AWS::StackName}-GetReportLambdaArn"

  ProcessReportDataLambdaArn:
    Description: ARN of the Process Report Data Lambda function
    Value: !GetAtt ProcessReportDataLambda.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ProcessReportDataLambdaArn"

  SendEmailLambdaArn:
    Description: ARN of the Send Email Lambda function
    Value: !GetAtt SendEmailLambda.Arn
    Export:
      Name: !Sub "${AWS::StackName}-SendEmailLambdaArn"

  SendEventReminderLambdaArn:
    Description: ARN of the Send Event Reminder Lambda function
    Value: !GetAtt SendEventReminderLambda.Arn
    Export:
      Name: !Sub "${AWS::StackName}-SendEventReminderLambdaArn"

  PostEventAssistanceLambdaArn:
    Description: ARN of the Post Event Assistance Lambda function
    Value: !GetAtt PostEventAssistanceLambda.Arn
    Export:
      Name: !Sub "${AWS::StackName}-PostEventAssistanceLambdaArn"

  CreateTaskLambdaArn:
    Description: ARN of the Create Task Lambda function
    Value: !GetAtt CreateTaskLambda.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CreateTaskLambdaArn"

  # Lambda Function Names
  CreateEventLambdaName:
    Description: Name of the Create Event Lambda function
    Value: !Ref CreateEventLambda
    Export:
      Name: !Sub "${AWS::StackName}-CreateEventLambdaName"

  DeleteEventLambdaName:
    Description: Name of the Delete Event Lambda function
    Value: !Ref DeleteEventLambda
    Export:
      Name: !Sub "${AWS::StackName}-DeleteEventLambdaName"

  UpdateEventLambdaName:
    Description: Name of the Update Event Lambda function
    Value: !Ref UpdateEventLambda
    Export:
      Name: !Sub "${AWS::StackName}-UpdateEventLambdaName"

  DisableEventLambdaName:
    Description: Name of the Disable Event Lambda function
    Value: !Ref DisableEventLambda
    Export:
      Name: !Sub "${AWS::StackName}-DisableEventLambdaName"

  GetActiveEventsLambdaName:
    Description: Name of the Get Active Events Lambda function
    Value: !Ref GetActiveEventsLambda
    Export:
      Name: !Sub "${AWS::StackName}-GetActiveEventsLambdaName"

  GenerateReportLambdaName:
    Description: Name of the Generate Report Lambda function
    Value: !Ref GenerateReportLambda
    Export:
      Name: !Sub "${AWS::StackName}-GenerateReportLambdaName"

  GetReportLambdaName:
    Description: Name of the Get Report Lambda function
    Value: !Ref GetReportLambda
    Export:
      Name: !Sub "${AWS::StackName}-GetReportLambdaName"

  ProcessReportDataLambdaName:
    Description: Name of the Process Report Data Lambda function
    Value: !Ref ProcessReportDataLambda
    Export:
      Name: !Sub "${AWS::StackName}-ProcessReportDataLambdaName"

  SendEmailLambdaName:
    Description: Name of the Send Email Lambda function
    Value: !Ref SendEmailLambda
    Export:
      Name: !Sub "${AWS::StackName}-SendEmailLambdaName"

  SendEventReminderLambdaName:
    Description: Name of the Send Event Reminder Lambda function
    Value: !Ref SendEventReminderLambda
    Export:
      Name: !Sub "${AWS::StackName}-SendEventReminderLambdaName"

  PostEventAssistanceLambdaName:
    Description: Name of the Post Event Assistance Lambda function
    Value: !Ref PostEventAssistanceLambda
    Export:
      Name: !Sub "${AWS::StackName}-PostEventAssistanceLambdaName"

  CreateTaskLambdaName:
    Description: Name of the Create Task Lambda function
    Value: !Ref CreateTaskLambda
    Export:
      Name: !Sub "${AWS::StackName}-CreateTaskLambdaName"
