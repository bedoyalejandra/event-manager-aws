AWSTemplateFormatVersion: "2010-09-09"
Description: Init DB Lambda to create tables

Parameters:
  RDSSecretArn:
    Type: String
  RDSClusterEndpoint:
    Type: String
  LambdaCodeBucket:
    Type: String
  LambdaCodeKey:
    Type: String
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Environment name

Resources:
  InitDBLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "InitDBLambda-${Environment}"
      Runtime: nodejs18.x
      Handler: init-db/index.handler
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          RDS_SECRET_ARN: !Ref RDSSecretArn
          DB_NAME: EventManagerDB
          DB_HOST: !Ref RDSClusterEndpoint
      Role: !GetAtt InitDBRole.Arn

  InitDBRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "InitDBLambdaRole-${Environment}-${AWS::AccountId}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: InitDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref RDSSecretArn
              - Effect: Allow
                Action:
                  - rds-db:connect
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  # Custom Resource to automatically invoke InitDB Lambda
  InitDBTrigger:
    Type: Custom::InitDBTrigger
    DependsOn: InitDBLambda
    Properties:
      ServiceToken: !GetAtt InitDBLambda.Arn
      # This will trigger the Lambda automatically when the stack is created/updated
      Timestamp: !Sub '${AWS::StackName}-${Environment}'

Outputs:
  InitDBLambdaName:
    Description: Nombre de la Lambda de inicialización de la DB
    Value: !Ref InitDBLambda
  
  InitDBLambdaArn:
    Description: ARN de la Lambda de inicialización de la DB
    Value: !GetAtt InitDBLambda.Arn
  
  InitDBStatus:
    Description: Estado de la inicialización de la base de datos
    Value: !GetAtt InitDBTrigger.Message
