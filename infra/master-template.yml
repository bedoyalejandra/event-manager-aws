AWSTemplateFormatVersion: '2010-09-09'
Description: Event Management App - Master Stack

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Environment name (dev or prod)
  
  DBUsername:
    Type: String
    Default: event_admin
    Description: Database username
  
  LambdaCodeKey:
    Type: String
    Default: lambda-functions.zip
    Description: S3 key for Lambda code package
  
  S3LambdaBucket:
    Type: String
    Description: S3 bucket containing Lambda code (created automatically)

  # Resource validation parameters
  CreateS3Buckets:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Whether to create new S3 buckets or use existing ones

  ExistingLambdaCodeBucket:
    Type: String
    Default: ""
    Description: Name of existing Lambda code bucket (required if CreateS3Buckets=false)

  ExistingReportsBucket:
    Type: String
    Default: ""
    Description: Name of existing reports bucket (required if CreateS3Buckets=false)

  # SES Resource validation parameters
  CreateSESResources:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Whether to create new SES resources or use existing ones

  ExistingSESConfigurationSet:
    Type: String
    Default: ""
    Description: Name of existing SES configuration set (required if CreateSESResources=false)

  DBEndpoint:
    Type: String
    Default: ""
    Description: RDS database endpoint (created automatically by deploy script)

  RDSSecretArn:
    Type: String
    Default: ""
    Description: ARN of the Secrets Manager secret with database credentials

Resources:
  # ===========================================
  # S3 Stack - Buckets para reportes
  # ===========================================
  S3Stack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${S3LambdaBucket}.s3.${AWS::Region}.amazonaws.com/templates/s3.yml'
      Parameters:
        Environment: !Ref Environment
        CreateS3Buckets: !Ref CreateS3Buckets
        ExistingLambdaCodeBucket: !Ref ExistingLambdaCodeBucket
        ExistingReportsBucket: !Ref ExistingReportsBucket

  # ===========================================
  # Cognito Stack - Autenticación de usuarios
  # ===========================================
  CognitoStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${S3LambdaBucket}.s3.${AWS::Region}.amazonaws.com/templates/cognito.yml'
      Parameters:
        Environment: !Ref Environment

  # ===========================================
  # SQS + SES Stack - Colas y servicio de email
  # ===========================================
  SQSSesStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${S3LambdaBucket}.s3.${AWS::Region}.amazonaws.com/templates/sqs-ses.yml'
      Parameters:
        Environment: !Ref Environment
        CreateSESResources: !Ref CreateSESResources
        ExistingSESConfigurationSet: !Ref ExistingSESConfigurationSet

  # ===========================================
  # Lambda Functions Stack - Todas las funciones
  # ===========================================
  LambdasStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: [S3Stack, SQSSesStack]
    Properties:
      TemplateURL: !Sub 'https://${S3LambdaBucket}.s3.${AWS::Region}.amazonaws.com/templates/lambdas.yml'
      Parameters:
        RDSSecretArn: !Ref RDSSecretArn
        RDSClusterEndpoint: !Ref DBEndpoint
        LambdaCodeBucket: !Ref S3LambdaBucket
        LambdaCodeKey: !Ref LambdaCodeKey
        ReportsBucket: !GetAtt S3Stack.Outputs.ReportsBucketName
        EmailQueue: !GetAtt SQSSesStack.Outputs.EmailQueueUrl
        Environment: !Ref Environment
        EventBusName: !Sub "EventManagerBus-${Environment}"
        SchedulerRoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/EventBridgeSchedulerRole-${Environment}"

  # ===========================================
  # EventBridge Stack - Event-driven workflows
  # ===========================================
  EventBridgeStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: [LambdasStack]
    Properties:
      TemplateURL: !Sub 'https://${S3LambdaBucket}.s3.${AWS::Region}.amazonaws.com/templates/eventbridge.yml'
      Parameters:
        Environment: !Ref Environment
        CreateEventLambdaArn: !GetAtt LambdasStack.Outputs.CreateEventLambdaArn
        DisableEventLambdaArn: !GetAtt LambdasStack.Outputs.DisableEventLambdaArn
        CreateTaskLambdaArn: !GetAtt LambdasStack.Outputs.CreateTaskLambdaArn

  # ===========================================
  # API Gateway Stack - API REST
  # ===========================================
  ApiGatewayStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: [LambdasStack, CognitoStack]
    Properties:
      TemplateURL: !Sub 'https://${S3LambdaBucket}.s3.${AWS::Region}.amazonaws.com/templates/apigateway.yml'
      Parameters:
        CognitoUserPoolId: !GetAtt CognitoStack.Outputs.UserPoolId
        CognitoUserPoolArn: !GetAtt CognitoStack.Outputs.UserPoolArn
        CreateEventLambdaArn: !GetAtt LambdasStack.Outputs.CreateEventLambdaArn
        UpdateEventLambdaArn: !GetAtt LambdasStack.Outputs.UpdateEventLambdaArn
        DeleteEventLambdaArn: !GetAtt LambdasStack.Outputs.DeleteEventLambdaArn
        GetActiveEventsLambdaArn: !GetAtt LambdasStack.Outputs.GetActiveEventsLambdaArn
        PostEventAssistanceLambdaArn: !GetAtt LambdasStack.Outputs.PostEventAssistanceLambdaArn
        PostReportLambdaArn: !GetAtt LambdasStack.Outputs.PostReportLambdaArn
        Environment: !Ref Environment

  # ===========================================
  # Step Functions Stack - Workflows
  # ===========================================
  StepFunctionsStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: LambdasStack
    Properties:
      TemplateURL: !Sub 'https://${S3LambdaBucket}.s3.${AWS::Region}.amazonaws.com/templates/stepfunctions.yml'
      Parameters:
        GenerateReportLambdaArn: !GetAtt LambdasStack.Outputs.GenerateReportLambdaArn
        ProcessReportDataLambdaArn: !GetAtt LambdasStack.Outputs.ProcessReportDataLambdaArn
        Environment: !Ref Environment

# ===========================================
# Outputs - Información importante del stack
# ===========================================
Outputs:
  StackName:
    Description: Nombre del stack principal
    Value: !Ref AWS::StackName
    Export:
      Name: !Sub "${AWS::StackName}-StackName"

  Environment:
    Description: Entorno de despliegue
    Value: !Ref Environment
    Export:
      Name: !Sub "${AWS::StackName}-Environment"

  ApiGatewayUrl:
    Description: URL del API Gateway
    Value: !GetAtt ApiGatewayStack.Outputs.ApiGatewayUrl
    Export:
      Name: !Sub "${AWS::StackName}-ApiGatewayUrl"


  CognitoUserPoolId:
    Description: ID del User Pool de Cognito
    Value: !GetAtt CognitoStack.Outputs.UserPoolId
    Export:
      Name: !Sub "${AWS::StackName}-CognitoUserPoolId"

  EventBusName:
    Description: EventBridge Event Bus name
    Value: !GetAtt EventBridgeStack.Outputs.EventBusName
    Export:
      Name: !Sub "${AWS::StackName}-EventBusName"

  EventBusArn:
    Description: EventBridge Event Bus ARN
    Value: !GetAtt EventBridgeStack.Outputs.EventBusArn
    Export:
      Name: !Sub "${AWS::StackName}-EventBusArn"
